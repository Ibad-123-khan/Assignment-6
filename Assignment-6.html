<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>

    <!-- <h1>Job Application Form</h1> -->


    <form action="" >

        <!-- Personal Information -->
        <fieldset>
            <legend>1. Personal Information</legend>

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" >
            <br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" >
            <br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter phone number" >
            <br><br>

            <label for="website"> Portfolio:</label><br>
            <input type="url" id="website" name="website"
                   placeholder="">
            <br><br>

            <label for="dob">Date of Birth:</label><br>
            <input type="date" >
            <br><br>
        </fieldset>

        <br>

        <!-- Job Details -->
        <fieldset>
            <legend>2. Job Details</legend>

            <label for="position">Job Position:</label><br>
            <select id="position" name="position" >
                <option value="">Select a position</option>
                <option value="frontend">Frontend Developer</option>
                <option value="backend">Backend Developer</option>
                <option value="uiux">UI/UX Designer</option>
                <option value="qa">QA Engineer</option>
            </select>

            <br><br>

            <p>Preferred Work Location:</p>

            <input type="radio" id="onsite"
                   name="location" value="onsite" required>
            <label for="onsite">On-site</label><br>

            <input type="radio" id="remote"
                   name="location" value="remote">
            <label for="remote">Remote</label><br>

            <input type="radio" id="hybrid"
                   name="location" value="hybrid">
            <label for="hybrid">Hybrid</label>

            <br><br>

            <p>Skills:</p>

            <input type="checkbox">
            <label for="html">HTML</label><br>

            <input type="checkbox">
            <label for="css">CSS</label><br>

            <input type="checkbox" >
            <label for="javascript">JavaScript</label><br>

            <input type="checkbox">
            <label for="react">React</label><br>

            <input type="checkbox" >
            <label for="nodejs">Node.js</label>

            <br><br>

            <label for="resume">Resume Upload:</label><br>
            <input type="file">

            <br><br>

            <label for="about">Write About Yourself:</label><br>
            <textarea idws="="about" name="about"
                      ro5" cols="40"
                      placeholder="Write about yourself..."></textarea>

        </fieldset>

        <br>

        <!-- Extra Section -->
        <fieldset>
            <legend>3. Extra Section</legend>

            <label for="tech">Search Your Favorite Tech Stack:</label><br>
            <input type="search"
                   placeholder="Search technology">

            <br><br>

            <label for="password">Password:</label><br>
            <input type="password" 
                   placeholder="Enter password" required>

            <br><br>

            <label for="confirm">Confirm Password:</label><br>
            <input type="password" 
                   placeholder="Confirm password" required>
<br> <br>
                   <input type="submit" value="Submit Application">
        </fieldset>

        <br>

       
        


    </form>

</body>
</html>
